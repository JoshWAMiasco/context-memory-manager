<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Oxanium, sans-serif" role="img" aria-labelledby="architecture-desktop-title">
  <title id="architecture-desktop-title">CMM on your computer: the app window talks to a private local server inside the app, which reads and saves your folders. Nothing leaves the computer.</title>
  <defs>
    <marker id="architecture-desktop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#275070"/>
    </marker>
    <symbol id="architecture-desktop-key" viewBox="0 0 34 16">
      <circle cx="8" cy="8" r="5.5" fill="#ffe8a3" stroke="#153049" stroke-width="2"/>
      <path d="M13.5 8 H32 M26 8 V13 M31 8 V12" fill="none" stroke="#153049" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- title -->
  <g fill="#0b1f2e">
    <text x="24" y="40" font-size="24" font-weight="700">CMM on your computer</text>
    <text x="24" y="66" font-size="15" fill="#31506a">Everything runs on this computer. Nothing leaves it.</text>
  </g>

  <!-- the computer -->
  <rect x="20" y="84" width="740" height="416" rx="16" fill="#f6fafc" stroke="#153049" stroke-width="2"/>
  <g fill="none" stroke="#153049" stroke-width="2" stroke-linejoin="round">
    <rect x="42" y="98" width="26" height="17" rx="2" fill="#e0f6fd"/>
    <path d="M37 120 H73 L70 115 H40 Z" fill="#b8ebfa"/>
  </g>
  <text x="82" y="116" font-size="16" font-weight="700" fill="#0b1f2e">Your computer</text>

  <!-- CMM desktop app -->
  <rect x="40" y="132" width="480" height="288" rx="12" fill="#e0f6fd" stroke="#275070" stroke-width="1.5"/>
  <text x="58" y="158" font-size="15" font-weight="700" fill="#0b1f2e">CMM desktop app</text>

  <!-- app window -->
  <g stroke="#275070" stroke-width="2">
    <rect x="66" y="180" width="136" height="100" rx="6" fill="#ffffff"/>
    <path d="M66 198 H202" fill="none"/>
    <rect x="74" y="206" width="30" height="66" rx="2" fill="#b8ebfa" stroke-width="1.2"/>
  </g>
  <g fill="#275070">
    <circle cx="76" cy="189" r="3"/><circle cx="87" cy="189" r="3"/><circle cx="98" cy="189" r="3"/>
  </g>
  <g fill="#c4d4e0">
    <rect x="112" y="208" width="80" height="8" rx="2"/>
    <rect x="112" y="224" width="62" height="8" rx="2"/>
    <rect x="112" y="240" width="72" height="8" rx="2"/>
    <rect x="112" y="256" width="50" height="8" rx="2"/>
  </g>
  <text x="134" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1f2e">App window</text>
  <text x="134" y="322" text-anchor="middle" font-size="13" fill="#31506a">what you see</text>

  <!-- window <-> server -->
  <path d="M210 230 H362" fill="none" stroke="#275070" stroke-width="2" marker-start="url(#architecture-desktop-arrow)" marker-end="url(#architecture-desktop-arrow)"/>
  <use href="#architecture-desktop-key" x="269" y="204" width="34" height="16"/>
  <text x="286" y="254" text-anchor="middle" font-size="13" fill="#0b1f2e">shared secret,</text>
  <text x="286" y="270" text-anchor="middle" font-size="13" fill="#0b1f2e">new each launch</text>

  <!-- private local server -->
  <g stroke="#275070" stroke-width="2" fill="#f0e8ff">
    <rect x="372" y="186" width="96" height="24" rx="4"/>
    <rect x="372" y="214" width="96" height="24" rx="4"/>
    <rect x="372" y="242" width="96" height="24" rx="4"/>
  </g>
  <g fill="#275070">
    <circle cx="384" cy="198" r="3"/><circle cx="394" cy="198" r="3"/>
    <circle cx="384" cy="226" r="3"/><circle cx="394" cy="226" r="3"/>
    <circle cx="384" cy="254" r="3"/><circle cx="394" cy="254" r="3"/>
  </g>
  <g stroke="#275070" stroke-width="2" stroke-linecap="round">
    <path d="M420 198 H456 M420 226 H456 M420 254 H456"/>
  </g>
  <text x="420" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1f2e">Private local server</text>
  <text x="420" y="322" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">127.0.0.1 only</text>

  <!-- database -->
  <path d="M420 330 V352" stroke="#275070" stroke-width="2" marker-start="url(#architecture-desktop-arrow)" marker-end="url(#architecture-desktop-arrow)"/>
  <g stroke="#275070" stroke-width="2">
    <path d="M396 364 V398 A24 7 0 0 0 444 398 V364" fill="#f0e8ff"/>
    <ellipse cx="420" cy="364" rx="24" ry="7" fill="#d9c4ff"/>
    <path d="M396 381 A24 7 0 0 0 444 381" fill="none" stroke-width="1.5"/>
  </g>
  <text x="382" y="378" text-anchor="end" font-size="14" font-weight="700" fill="#0b1f2e">Settings &amp; accounts</text>
  <text x="382" y="396" text-anchor="end" font-size="13" fill="#31506a">small local database</text>

  <!-- your folders -->
  <rect x="566" y="132" width="170" height="288" rx="12" fill="#edf2ff" stroke="#275070" stroke-width="1.5"/>
  <text x="651" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1f2e">Your folders</text>
  <path d="M624 186 a3 3 0 0 1 3 -3 h14 l5 5 h28 a3 3 0 0 1 3 3 v30 a3 3 0 0 1 -3 3 h-47 a3 3 0 0 1 -3 -3 z" fill="#b8ebfa" stroke="#275070" stroke-width="2" stroke-linejoin="round"/>
  <path d="M624 196 H677" stroke="#275070" stroke-width="1.5"/>
  <text x="651" y="246" text-anchor="middle" font-size="14" fill="#0b1f2e">Home folder</text>
  <g stroke="#275070" stroke-width="2" stroke-linejoin="round">
    <rect x="620" y="284" width="42" height="26" rx="5" fill="#ffe8a3"/>
    <rect x="662" y="289" width="16" height="16" rx="1" fill="#ffffff"/>
    <path d="M668 294 h4 M668 300 h4" stroke-width="1.5"/>
  </g>
  <text x="651" y="334" text-anchor="middle" font-size="14" fill="#0b1f2e">USB drives</text>
  <text x="651" y="352" text-anchor="middle" font-size="13" fill="#31506a">and other drives</text>

  <!-- server <-> folders -->
  <g fill="none" stroke="#275070" stroke-width="2">
    <path d="M476 212 L612 200" marker-start="url(#architecture-desktop-arrow)" marker-end="url(#architecture-desktop-arrow)"/>
    <path d="M476 248 L608 292" marker-start="url(#architecture-desktop-arrow)" marker-end="url(#architecture-desktop-arrow)"/>
  </g>
  <text x="542" y="192" text-anchor="middle" font-size="13" fill="#0b1f2e">open &amp; save</text>

  <!-- other programs: blocked -->
  <g stroke="#275070" stroke-width="2">
    <rect x="52" y="454" width="34" height="26" rx="3" fill="#ffffff"/>
    <path d="M52 462 H86" fill="none"/>
    <path d="M69 452 V424" fill="none" stroke-dasharray="4 3" marker-end="url(#architecture-desktop-arrow)"/>
    <circle cx="69" cy="437" r="9" fill="#ffe2e7" stroke="#a3203a"/>
    <path d="M62.6 443.4 L75.4 430.6" stroke="#a3203a"/>
  </g>
  <text x="100" y="466" font-size="14" fill="#0b1f2e"><tspan font-weight="700">Other programs</tspan> can't get in: they don't have the secret.</text>

  <!-- internet: not used -->
  <path d="M762 230 H818" fill="none" stroke="#275070" stroke-width="2" stroke-dasharray="5 4"/>
  <g stroke="#a3203a" stroke-width="2.5" stroke-linecap="round">
    <path d="M783 223 l12 14 M795 223 l-12 14"/>
  </g>
  <path d="M836 248 a14 14 0 0 1 2 -28 a20 20 0 0 1 38 -6 a16 16 0 0 1 14 34 z" fill="#ffffff" stroke="#275070" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <text x="862" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1f2e">Internet</text>
  <text x="862" y="298" text-anchor="middle" font-size="13" fill="#31506a">not used</text>

  <!-- badge -->
  <rect x="782" y="330" width="160" height="56" rx="28" fill="#ddfbef" stroke="#153049" stroke-width="2"/>
  <circle cx="812" cy="358" r="12" fill="#a8f5d5" stroke="#153049" stroke-width="2"/>
  <path d="M806 358 l4 4 l8 -8" fill="none" stroke="#153049" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="834" y="354" font-size="15" font-weight="700" fill="#0b1f2e">No internet</text>
  <text x="834" y="372" font-size="15" font-weight="700" fill="#0b1f2e">needed</text>
</svg>
