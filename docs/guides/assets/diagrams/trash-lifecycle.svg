<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Oxanium, sans-serif" role="img" aria-labelledby="trash-lifecycle-title">
  <title id="trash-lifecycle-title">What happens when you delete: the item goes to CMM Trash, kept on the same drive in .cmm-trash. From there you can restore it to its place, delete it permanently after confirming, or, in the desktop app only, move it to the computer's trash.</title>
  <defs>
    <marker id="trash-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#275070"/>
    </marker>
    <symbol id="trash-lifecycle-can" viewBox="0 0 40 46">
      <path d="M15 5 V2 H25 V5" fill="none" stroke="#153049" stroke-width="2" stroke-linejoin="round"/>
      <rect x="2" y="5" width="36" height="6" rx="2" fill="#ffffff" stroke="#153049" stroke-width="2"/>
      <path d="M6 11 L8.5 44 H31.5 L34 11 Z" fill="#ffffff" stroke="#153049" stroke-width="2" stroke-linejoin="round"/>
      <path d="M14 17 V38 M20 17 V38 M26 17 V38" stroke="#153049" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>

  <text x="24" y="40" font-size="24" font-weight="700" fill="#0b1f2e">What happens when you delete</text>
  <text x="24" y="66" font-size="15" fill="#31506a">Deleted items wait in CMM Trash until you decide what to do with them.</text>

  <!-- your file -->
  <rect x="24" y="178" width="160" height="104" rx="12" fill="#ffffff" stroke="#275070" stroke-width="1.5"/>
  <g stroke="#153049" stroke-width="2" stroke-linejoin="round">
    <path d="M40 196 h20 l9 9 v34 h-29 z" fill="#e0f6fd"/>
    <path d="M60 196 v9 h9" fill="none"/>
    <path d="M46 216 h17 M46 223 h17 M46 230 h11" stroke-width="1.5"/>
  </g>
  <text x="82" y="214" font-size="16" font-weight="700" fill="#0b1f2e">Your file</text>
  <text x="82" y="233" font-size="13" fill="#31506a">or folder</text>
  <text x="40" y="266" font-size="13" fill="#31506a">in any storage</text>

  <!-- delete arrow -->
  <path d="M188 230 H290" fill="none" stroke="#275070" stroke-width="2.5" marker-end="url(#trash-lifecycle-arrow)"/>
  <text x="238" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f2e">Delete</text>

  <!-- CMM Trash -->
  <rect x="294" y="128" width="200" height="204" rx="14" fill="#f0e8ff" stroke="#153049" stroke-width="2"/>
  <use href="#trash-lifecycle-can" x="370" y="144" width="48" height="55"/>
  <text x="394" y="230" text-anchor="middle" font-size="19" font-weight="700" fill="#0b1f2e">CMM Trash</text>
  <text x="394" y="254" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">.cmm-trash</text>
  <text x="394" y="280" text-anchor="middle" font-size="13" fill="#31506a">kept on the same drive,</text>
  <text x="394" y="297" text-anchor="middle" font-size="13" fill="#31506a">nothing is lost yet</text>

  <!-- fan-out -->
  <g fill="none" stroke="#275070" stroke-width="2">
    <path d="M496 230 C540 230 540 138 586 138" marker-end="url(#trash-lifecycle-arrow)"/>
    <path d="M496 230 C540 230 540 232 586 232" marker-end="url(#trash-lifecycle-arrow)"/>
    <path d="M496 230 C540 230 540 326 586 326" stroke-dasharray="6 4" marker-end="url(#trash-lifecycle-arrow)"/>
  </g>

  <!-- restore -->
  <rect x="590" y="98" width="346" height="80" rx="12" fill="#ddfbef" stroke="#275070" stroke-width="1.5"/>
  <circle cx="628" cy="138" r="20" fill="#ffffff" stroke="#153049" stroke-width="2"/>
  <path d="M617 133 H630 a7 7 0 0 1 0 14 H622" fill="none" stroke="#153049" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M622 127 L616 133 L622 139" fill="none" stroke="#153049" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="662" y="133" font-size="17" font-weight="700" fill="#0b1f2e">Restore</text>
  <text x="662" y="154" font-size="13" fill="#31506a">puts it back where it was</text>

  <!-- delete permanently -->
  <rect x="590" y="192" width="346" height="80" rx="12" fill="#ffe2e7" stroke="#153049" stroke-width="2"/>
  <circle cx="628" cy="232" r="20" fill="#ffffff" stroke="#153049" stroke-width="2"/>
  <path d="M620 224 l16 16 M636 224 l-16 16" stroke="#153049" stroke-width="2.6" stroke-linecap="round"/>
  <text x="662" y="227" font-size="17" font-weight="700" fill="#0b1f2e">Delete permanently</text>
  <text x="662" y="248" font-size="13" fill="#31506a">gone for good; CMM asks you to confirm</text>

  <!-- move to computer's trash -->
  <rect x="590" y="286" width="346" height="80" rx="12" fill="#edf2ff" stroke="#275070" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="628" cy="326" r="20" fill="#ffffff" stroke="#153049" stroke-width="2"/>
  <use href="#trash-lifecycle-can" x="618" y="314" width="20" height="23"/>
  <text x="662" y="321" font-size="17" font-weight="700" fill="#0b1f2e">Move to computer's trash</text>
  <text x="662" y="342" font-size="13" fill="#31506a">the Recycle Bin or Trash of your system</text>
  <rect x="662" y="376" width="136" height="26" rx="13" fill="#ffffff" stroke="#275070" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="730" y="394" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1f2e">desktop app only</text>
</svg>
