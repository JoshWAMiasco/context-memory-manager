<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Oxanium, sans-serif" role="img" aria-labelledby="backup-modes-title">
  <title id="backup-modes-title">Backup modes. Copy adds new and changed files and never deletes. Mirror makes the destination match the source; extra files on the destination go to its Trash, and a password is needed. Snapshot makes a new dated folder each run and keeps the last N.</title>
  <defs>
    <marker id="backup-modes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#275070"/>
    </marker>
    <symbol id="backup-modes-folder" viewBox="0 0 20 16">
      <path d="M1 3 a2 2 0 0 1 2 -2 h5 l2 2 h7 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 h-14 a2 2 0 0 1 -2 -2 z" fill="#ffffff" stroke="#153049" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="backup-modes-usb" viewBox="0 0 24 14">
      <rect x="1" y="1" width="15" height="12" rx="2.5" fill="#ffe8a3" stroke="#153049" stroke-width="1.6"/>
      <rect x="16" y="3.5" width="7" height="7" rx="1" fill="#ffffff" stroke="#153049" stroke-width="1.6"/>
    </symbol>
    <symbol id="backup-modes-lock" viewBox="0 0 16 18">
      <path d="M4 8 V5.5 a4 4 0 0 1 8 0 V8" fill="none" stroke="#153049" stroke-width="1.8"/>
      <rect x="1.5" y="8" width="13" height="9" rx="2" fill="#ffd166" stroke="#153049" stroke-width="1.6"/>
    </symbol>
  </defs>

  <text x="24" y="40" font-size="24" font-weight="700" fill="#0b1f2e">Three ways to back up</text>
  <text x="24" y="66" font-size="15" fill="#31506a">Each run copies a source folder to a destination, such as a USB drive.</text>


  <!-- copy -->
  <g transform="translate(20 0)">
    <rect x="0" y="84" width="292" height="398" rx="14" fill="#f6fafc" stroke="#275070" stroke-width="1.5"/>
    <path d="M0 98 a14 14 0 0 1 14 -14 H278 a14 14 0 0 1 14 14 V138 H0 Z" fill="#e0f6fd" stroke="#275070" stroke-width="1.5"/>
    <rect x="18" y="98" width="20" height="25" rx="2" fill="#ffffff" stroke="#153049" stroke-width="2"/>
    <rect x="26" y="104" width="20" height="25" rx="2" fill="#ffffff" stroke="#153049" stroke-width="2"/>
    <path d="M36 111 v10 M31 116 h10" stroke="#153049" stroke-width="2" stroke-linecap="round"/>
    <text x="58" y="119" font-size="20" font-weight="700" fill="#0b1f2e">Copy</text>
    <rect x="12" y="152" width="268" height="66" rx="10" fill="#ffffff" stroke="#275070" stroke-width="1.5"/>
    <use href="#backup-modes-folder" x="28" y="160" width="20" height="16"/>
    <text x="56" y="173" font-size="14" font-weight="700" fill="#0b1f2e">Source</text>
    <rect x="28" y="184" width="66" height="24" rx="5" fill="#edf2ff" stroke="#275070" stroke-width="1.2"/>
    <text x="61" y="200" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">a.md</text>
    <rect x="106" y="184" width="66" height="24" rx="5" fill="#edf2ff" stroke="#275070" stroke-width="1.2"/>
    <text x="139" y="200" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">b.md</text>
    <rect x="184" y="184" width="66" height="24" rx="5" fill="#edf2ff" stroke="#275070" stroke-width="1.2"/>
    <text x="217" y="200" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">c.md</text>
    <path d="M146 222 V250" fill="none" stroke="#275070" stroke-width="2.5" marker-end="url(#backup-modes-arrow)"/>
    <rect x="12" y="256" width="268" height="146" rx="10" fill="#ffffff" stroke="#275070" stroke-width="1.5"/>
    <use href="#backup-modes-usb" x="28" y="263" width="24" height="14"/>
    <text x="60" y="276" font-size="14" font-weight="700" fill="#0b1f2e">Destination</text>
    <text x="28" y="307" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">a.md</text>
    <rect x="216" y="293" width="56" height="20" rx="10" fill="#ffffff" stroke="#9fb4c4" stroke-width="1.2"/>
    <text x="244" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1f2e">same</text>
    <text x="28" y="335" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">b.md</text>
    <rect x="216" y="321" width="56" height="20" rx="10" fill="#e0f6fd" stroke="#275070" stroke-width="1.2"/>
    <text x="244" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1f2e">updated</text>
    <text x="28" y="363" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">c.md</text>
    <rect x="216" y="349" width="56" height="20" rx="10" fill="#ddfbef" stroke="#275070" stroke-width="1.2"/>
    <text x="244" y="363" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1f2e">+ new</text>
    <text x="28" y="391" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">old.md</text>
    <rect x="216" y="377" width="56" height="20" rx="10" fill="#ffffff" stroke="#275070" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="244" y="391" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1f2e">kept</text>
    <text x="18" y="430" font-size="14" font-weight="700" fill="#0b1f2e">Adds new and changed files.</text>
    <text x="18" y="450" font-size="14" fill="#0b1f2e">Never deletes anything.</text>
  </g>

  <!-- mirror -->
  <g transform="translate(334 0)">
    <rect x="0" y="84" width="292" height="398" rx="14" fill="#f6fafc" stroke="#275070" stroke-width="1.5"/>
    <path d="M0 98 a14 14 0 0 1 14 -14 H278 a14 14 0 0 1 14 14 V138 H0 Z" fill="#fff3d1" stroke="#275070" stroke-width="1.5"/>
    <g fill="none" stroke="#153049" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 106 H44 M38 100 L44 106 L38 112"/>
      <path d="M44 122 H18 M24 116 L18 122 L24 128"/>
    </g>
    <text x="58" y="119" font-size="20" font-weight="700" fill="#0b1f2e">Mirror</text>
    <rect x="168" y="98" width="110" height="26" rx="13" fill="#ffffff" stroke="#153049" stroke-width="1.5"/>
    <use href="#backup-modes-lock" x="178" y="102" width="16" height="18"/>
    <text x="200" y="116" font-size="13" font-weight="700" fill="#0b1f2e">password</text>
    <rect x="12" y="152" width="268" height="66" rx="10" fill="#ffffff" stroke="#275070" stroke-width="1.5"/>
    <use href="#backup-modes-folder" x="28" y="160" width="20" height="16"/>
    <text x="56" y="173" font-size="14" font-weight="700" fill="#0b1f2e">Source</text>
    <rect x="28" y="184" width="66" height="24" rx="5" fill="#edf2ff" stroke="#275070" stroke-width="1.2"/>
    <text x="61" y="200" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">a.md</text>
    <rect x="106" y="184" width="66" height="24" rx="5" fill="#edf2ff" stroke="#275070" stroke-width="1.2"/>
    <text x="139" y="200" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">b.md</text>
    <rect x="184" y="184" width="66" height="24" rx="5" fill="#edf2ff" stroke="#275070" stroke-width="1.2"/>
    <text x="217" y="200" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">c.md</text>
    <path d="M146 222 V250" fill="none" stroke="#275070" stroke-width="2.5" marker-end="url(#backup-modes-arrow)"/>
    <rect x="12" y="256" width="268" height="146" rx="10" fill="#ffffff" stroke="#275070" stroke-width="1.5"/>
    <use href="#backup-modes-usb" x="28" y="263" width="24" height="14"/>
    <text x="60" y="276" font-size="14" font-weight="700" fill="#0b1f2e">Destination</text>
    <text x="28" y="307" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">a.md</text>
    <rect x="216" y="293" width="56" height="20" rx="10" fill="#ffffff" stroke="#9fb4c4" stroke-width="1.2"/>
    <text x="244" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1f2e">same</text>
    <text x="28" y="335" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">b.md</text>
    <rect x="216" y="321" width="56" height="20" rx="10" fill="#e0f6fd" stroke="#275070" stroke-width="1.2"/>
    <text x="244" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1f2e">updated</text>
    <text x="28" y="363" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">c.md</text>
    <rect x="216" y="349" width="56" height="20" rx="10" fill="#ddfbef" stroke="#275070" stroke-width="1.2"/>
    <text x="244" y="363" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1f2e">+ new</text>
    <text x="28" y="391" font-family="'Martian Mono', monospace" font-size="12" fill="#153049" text-decoration="line-through">old.md</text>
    <rect x="216" y="377" width="56" height="20" rx="10" fill="#ffe2e7" stroke="#153049" stroke-width="1.2"/>
    <text x="244" y="391" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1f2e">→ Trash</text>
    <text x="18" y="430" font-size="14" font-weight="700" fill="#0b1f2e">Destination matches the source.</text>
    <text x="18" y="450" font-size="14" fill="#0b1f2e">Extra files on the destination</text>
    <text x="18" y="470" font-size="14" fill="#0b1f2e">go to its Trash.</text>
  </g>

  <!-- snapshot -->
  <g transform="translate(648 0)">
    <rect x="0" y="84" width="292" height="398" rx="14" fill="#f6fafc" stroke="#275070" stroke-width="1.5"/>
    <path d="M0 98 a14 14 0 0 1 14 -14 H278 a14 14 0 0 1 14 14 V138 H0 Z" fill="#f0e8ff" stroke="#275070" stroke-width="1.5"/>
    <path d="M18 106 h7 l3 -5 h10 l3 5 h5 v20 h-28 z" fill="#ffffff" stroke="#153049" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="32" cy="115" r="6" fill="#d9c4ff" stroke="#153049" stroke-width="2"/>
    <text x="58" y="119" font-size="20" font-weight="700" fill="#0b1f2e">Snapshot</text>
    <rect x="12" y="152" width="268" height="66" rx="10" fill="#ffffff" stroke="#275070" stroke-width="1.5"/>
    <use href="#backup-modes-folder" x="28" y="160" width="20" height="16"/>
    <text x="56" y="173" font-size="14" font-weight="700" fill="#0b1f2e">Source</text>
    <rect x="28" y="184" width="66" height="24" rx="5" fill="#edf2ff" stroke="#275070" stroke-width="1.2"/>
    <text x="61" y="200" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">a.md</text>
    <rect x="106" y="184" width="66" height="24" rx="5" fill="#edf2ff" stroke="#275070" stroke-width="1.2"/>
    <text x="139" y="200" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">b.md</text>
    <rect x="184" y="184" width="66" height="24" rx="5" fill="#edf2ff" stroke="#275070" stroke-width="1.2"/>
    <text x="217" y="200" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">c.md</text>
    <path d="M146 222 V250" fill="none" stroke="#275070" stroke-width="2.5" marker-end="url(#backup-modes-arrow)"/>
    <rect x="12" y="256" width="268" height="146" rx="10" fill="#ffffff" stroke="#275070" stroke-width="1.5"/>
    <use href="#backup-modes-usb" x="28" y="263" width="24" height="14"/>
    <text x="60" y="276" font-size="14" font-weight="700" fill="#0b1f2e">Destination</text>
    <use href="#backup-modes-folder" x="20" y="295" width="18" height="14"/>
    <text x="42" y="307" font-family="'Martian Mono', monospace" font-size="12" fill="#153049" text-decoration="line-through">2026-10-20_18-05-12</text>
    <rect x="216" y="293" width="56" height="20" rx="10" fill="#ffe2e7" stroke="#153049" stroke-width="1.2"/>
    <text x="244" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1f2e">→ Trash</text>
    <use href="#backup-modes-folder" x="20" y="323" width="18" height="14"/>
    <text x="42" y="335" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">2026-10-24_09-00-00</text>
    <rect x="216" y="321" width="56" height="20" rx="10" fill="#ffffff" stroke="#275070" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="244" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1f2e">kept</text>
    <use href="#backup-modes-folder" x="20" y="351" width="18" height="14"/>
    <text x="42" y="363" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">2026-10-25_14-30-00</text>
    <rect x="216" y="349" width="56" height="20" rx="10" fill="#ddfbef" stroke="#275070" stroke-width="1.2"/>
    <text x="244" y="363" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1f2e">+ new</text>
    <text x="28" y="388" font-size="13" fill="#31506a">each one holds a full copy</text>
    <text x="18" y="430" font-size="14" font-weight="700" fill="#0b1f2e">A new dated folder each run.</text>
    <text x="18" y="450" font-size="14" fill="#0b1f2e">Keeps the last N snapshots;</text>
    <text x="18" y="470" font-size="14" fill="#0b1f2e">older ones go to the Trash.</text>
  </g>
</svg>
