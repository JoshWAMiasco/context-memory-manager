<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Oxanium, sans-serif" role="img" aria-labelledby="network-confirm-title">
  <title id="network-confirm-title">When CCM asks for your password again before uploads and downloads: the desktop app never asks; a server on the same network asks once per sign-in; a server reached from outside asks before every upload or download.</title>
  <defs>
    <symbol id="network-confirm-prompt" viewBox="0 0 40 30">
      <path d="M5 1 H35 a4 4 0 0 1 4 4 V19 a4 4 0 0 1 -4 4 H24 L20 28 L16 23 H5 a4 4 0 0 1 -4 -4 V5 a4 4 0 0 1 4 -4 Z" fill="#fff3d1" stroke="#153049" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="11" cy="12" r="2.8" fill="#153049"/><circle cx="20" cy="12" r="2.8" fill="#153049"/><circle cx="29" cy="12" r="2.8" fill="#153049"/>
    </symbol>
    <symbol id="network-confirm-up" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="16" fill="#e0f6fd" stroke="#275070" stroke-width="2"/>
      <path d="M18 26 V11 M12 16 L18 10 L24 16" fill="none" stroke="#153049" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="network-confirm-down" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="16" fill="#e0f6fd" stroke="#275070" stroke-width="2"/>
      <path d="M18 10 V25 M12 20 L18 26 L24 20" fill="none" stroke="#153049" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="network-confirm-signin" viewBox="0 0 30 30">
      <path d="M17 4 H25 V26 H17" fill="none" stroke="#153049" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M3 15 H17 M12 10 L17 15 L12 20" fill="none" stroke="#153049" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="network-confirm-laptop" viewBox="0 0 60 40">
      <rect x="9" y="2" width="42" height="28" rx="3" fill="#ffffff" stroke="#153049" stroke-width="2"/>
      <path d="M2 37 H58 L54 31 H6 Z" fill="#c9d8ff" stroke="#153049" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="30" cy="12" r="4" fill="#153049"/>
      <path d="M22 26 a8 7 0 0 1 16 0" fill="#153049"/>
    </symbol>
  </defs>

  <text x="24" y="40" font-size="24" font-weight="700" fill="#0b1f2e">When CCM asks for your password again</text>
  <text x="24" y="66" font-size="15" fill="#31506a">Before you upload files to CCM or download them to your device.</text>

  <!-- card 1: desktop -->
  <g transform="translate(20 0)">
    <rect x="0" y="86" width="290" height="358" rx="14" fill="#f6fafc" stroke="#275070" stroke-width="1.5"/>
    <use href="#network-confirm-laptop" x="115" y="100" width="60" height="40"/>
    <text x="145" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#0b1f2e">Desktop app</text>
    <text x="145" y="187" text-anchor="middle" font-size="13" fill="#31506a">CCM on your own computer</text>
    <rect x="65" y="204" width="160" height="78" rx="12" fill="#ddfbef" stroke="#153049" stroke-width="2"/>
    <text x="145" y="250" text-anchor="middle" font-size="40" font-weight="700" fill="#0b1f2e">0</text>
    <text x="145" y="272" text-anchor="middle" font-size="13" fill="#0b1f2e">password prompts</text>
    <text x="145" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f2e">Never asks</text>
    <path d="M24 396 H270" stroke="#9fb4c4" stroke-width="2" stroke-dasharray="3 4"/>
    <use href="#network-confirm-signin" x="16" y="381" width="30" height="30"/>
    <use href="#network-confirm-up" x="82" y="378" width="36" height="36"/>
    <use href="#network-confirm-down" x="152" y="378" width="36" height="36"/>
    <use href="#network-confirm-up" x="222" y="378" width="36" height="36"/>
    <text x="31" y="430" text-anchor="middle" font-size="12" fill="#31506a">sign in</text>
    <text x="170" y="358" text-anchor="middle" font-size="13" fill="#31506a">no questions asked</text>
  </g>

  <!-- card 2: server, LAN -->
  <g transform="translate(335 0)">
    <rect x="0" y="86" width="290" height="358" rx="14" fill="#f6fafc" stroke="#275070" stroke-width="1.5"/>
    <path d="M103 122 L145 96 L187 122 V146 H103 Z" fill="#edf2ff" stroke="#153049" stroke-width="2" stroke-linejoin="round"/>
    <use href="#network-confirm-laptop" x="124" y="118" width="42" height="28"/>
    <text x="145" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#0b1f2e">Server, same network</text>
    <text x="145" y="187" text-anchor="middle" font-size="13" fill="#31506a">at home or in the office (LAN)</text>
    <rect x="65" y="204" width="160" height="78" rx="12" fill="#fff3d1" stroke="#153049" stroke-width="2"/>
    <text x="145" y="250" text-anchor="middle" font-size="40" font-weight="700" fill="#0b1f2e">1</text>
    <text x="145" y="272" text-anchor="middle" font-size="13" fill="#0b1f2e">password prompt</text>
    <text x="145" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f2e">Once per sign-in</text>
    <path d="M24 396 H270" stroke="#9fb4c4" stroke-width="2" stroke-dasharray="3 4"/>
    <use href="#network-confirm-signin" x="16" y="381" width="30" height="30"/>
    <use href="#network-confirm-prompt" x="80" y="340" width="40" height="30"/>
    <use href="#network-confirm-up" x="82" y="378" width="36" height="36"/>
    <use href="#network-confirm-down" x="152" y="378" width="36" height="36"/>
    <use href="#network-confirm-up" x="222" y="378" width="36" height="36"/>
    <text x="31" y="430" text-anchor="middle" font-size="12" fill="#31506a">sign in</text>
    <text x="205" y="358" text-anchor="middle" font-size="13" fill="#31506a">then no more</text>
  </g>

  <!-- card 3: server, remote -->
  <g transform="translate(650 0)">
    <rect x="0" y="86" width="290" height="358" rx="14" fill="#f6fafc" stroke="#275070" stroke-width="1.5"/>
    <use href="#network-confirm-laptop" x="96" y="104" width="54" height="36"/>
    <g fill="none" stroke="#153049" stroke-width="2">
      <circle cx="176" cy="118" r="16" fill="#edf2ff"/>
      <ellipse cx="176" cy="118" rx="7" ry="16"/>
      <path d="M160 118 H192 M163 109 H189 M163 127 H189" stroke-width="1.5"/>
    </g>
    <text x="145" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#0b1f2e">Server, from outside</text>
    <text x="145" y="187" text-anchor="middle" font-size="13" fill="#31506a">away from that network (remote)</text>
    <rect x="45" y="204" width="200" height="78" rx="12" fill="#ffe8d6" stroke="#153049" stroke-width="2"/>
    <text x="145" y="248" text-anchor="middle" font-size="30" font-weight="700" fill="#0b1f2e">every time</text>
    <text x="145" y="272" text-anchor="middle" font-size="13" fill="#0b1f2e">password prompts</text>
    <text x="145" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1f2e">Before every action</text>
    <path d="M24 396 H270" stroke="#9fb4c4" stroke-width="2" stroke-dasharray="3 4"/>
    <use href="#network-confirm-signin" x="16" y="381" width="30" height="30"/>
    <use href="#network-confirm-prompt" x="80" y="340" width="40" height="30"/>
    <use href="#network-confirm-prompt" x="150" y="340" width="40" height="30"/>
    <use href="#network-confirm-prompt" x="220" y="340" width="40" height="30"/>
    <use href="#network-confirm-up" x="82" y="378" width="36" height="36"/>
    <use href="#network-confirm-down" x="152" y="378" width="36" height="36"/>
    <use href="#network-confirm-up" x="222" y="378" width="36" height="36"/>
    <text x="31" y="430" text-anchor="middle" font-size="12" fill="#31506a">sign in</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#0b1f2e">
    <use href="#network-confirm-prompt" x="250" y="462" width="30" height="23"/>
    <text x="288" y="479">CCM asks for your password</text>
    <use href="#network-confirm-up" x="490" y="462" width="24" height="24"/>
    <text x="520" y="479">upload</text>
    <use href="#network-confirm-down" x="586" y="462" width="24" height="24"/>
    <text x="616" y="479">download</text>
  </g>
</svg>
