<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Oxanium, sans-serif" role="img" aria-labelledby="encryption-flow-title">
  <title id="encryption-flow-title">Encryption. Turning it on: generate a key, download the key file, verify it by uploading it back, then CCM encrypts the files. Opening an encrypted folder: key file plus account password unlock it; the key is kept in memory only and forgotten on lock, sign-out or timeout. Lose the key file and you lose the data.</title>
  <defs>
    <marker id="encryption-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#275070"/>
    </marker>
    <symbol id="encryption-flow-key" viewBox="0 0 48 24">
      <circle cx="11" cy="12" r="8" fill="#ffe8a3" stroke="#153049" stroke-width="2.5"/>
      <circle cx="11" cy="12" r="2.5" fill="#153049"/>
      <path d="M19 12 H45 M37 12 V19 M44 12 V18" fill="none" stroke="#153049" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="encryption-flow-keyfile" viewBox="0 0 34 42">
      <path d="M2 2 H22 L32 12 V40 H2 Z" fill="#ffffff" stroke="#153049" stroke-width="2" stroke-linejoin="round"/>
      <path d="M22 2 V12 H32" fill="#e0f6fd" stroke="#153049" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="11" cy="26" r="4.5" fill="#ffe8a3" stroke="#153049" stroke-width="2"/>
      <path d="M15.5 26 H27 M23 26 V30" fill="none" stroke="#153049" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="encryption-flow-lock" viewBox="0 0 24 26">
      <path d="M6 11 V8 a6 6 0 0 1 12 0 V11" fill="none" stroke="#153049" stroke-width="2.2"/>
      <rect x="2" y="11" width="20" height="13" rx="2.5" fill="#d9c4ff" stroke="#153049" stroke-width="2"/>
      <circle cx="12" cy="17" r="2" fill="#153049"/>
    </symbol>
  </defs>

  <!-- title + warning -->
  <text x="24" y="42" font-size="24" font-weight="700" fill="#0b1f2e">Encryption</text>
  <g>
    <rect x="622" y="16" width="318" height="40" rx="8" fill="#fff3d1" stroke="#153049" stroke-width="2"/>
    <path d="M647 24 L661 48 H633 Z" fill="#ffd166" stroke="#153049" stroke-width="2" stroke-linejoin="round"/>
    <path d="M647 32 V40" stroke="#153049" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="647" cy="44.5" r="1.5" fill="#153049"/>
    <text x="672" y="41" font-size="15" font-weight="700" fill="#0b1f2e">Lose the key file = lose the data</text>
  </g>

  <!-- lane A -->
  <rect x="20" y="72" width="920" height="200" rx="14" fill="#f6fafc" stroke="#275070" stroke-width="1.5"/>
  <text x="44" y="102" font-size="17" font-weight="700" fill="#0b1f2e">Turn on encryption</text>
  <text x="206" y="102" font-size="14" fill="#31506a">once for each folder you want to protect</text>

  <g stroke="#275070" stroke-width="1.5">
    <rect x="45" y="116" width="192" height="140" rx="10" fill="#ffffff"/>
    <rect x="271" y="116" width="192" height="140" rx="10" fill="#ffffff"/>
    <rect x="497" y="116" width="192" height="140" rx="10" fill="#ffffff"/>
    <rect x="723" y="116" width="192" height="140" rx="10" fill="#e0f6fd" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#275070" stroke-width="2">
    <path d="M239 186 H267" marker-end="url(#encryption-flow-arrow)"/>
    <path d="M465 186 H493" marker-end="url(#encryption-flow-arrow)"/>
    <path d="M691 186 H719" marker-end="url(#encryption-flow-arrow)"/>
  </g>
  <!-- step numbers -->
  <g fill="#153049">
    <circle cx="67" cy="138" r="13"/><circle cx="293" cy="138" r="13"/><circle cx="519" cy="138" r="13"/><circle cx="745" cy="138" r="13"/>
  </g>
  <g fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">
    <text x="67" y="143">1</text><text x="293" y="143">2</text><text x="519" y="143">3</text><text x="745" y="143">4</text>
  </g>
  <!-- 1 generate -->
  <use href="#encryption-flow-key" x="117" y="140" width="48" height="24"/>
  <path d="M110 136 v8 M106 140 h8 M171 158 v6 M168 161 h6" stroke="#153049" stroke-width="1.8" stroke-linecap="round"/>
  <text x="141" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1f2e">Generate key</text>
  <text x="141" y="226" text-anchor="middle" font-size="13" fill="#31506a">CCM makes a new key</text>
  <!-- 2 download -->
  <use href="#encryption-flow-keyfile" x="343" y="128" width="34" height="42"/>
  <path d="M396 132 V156" stroke="#153049" stroke-width="2.4" marker-end="url(#encryption-flow-arrow)"/>
  <path d="M386 166 H406" stroke="#153049" stroke-width="2.4" stroke-linecap="round"/>
  <text x="367" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1f2e">Download key file</text>
  <text x="367" y="226" text-anchor="middle" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">.ccmkey</text>
  <text x="367" y="244" text-anchor="middle" font-size="13" fill="#31506a">keep it somewhere safe</text>
  <!-- 3 verify -->
  <use href="#encryption-flow-keyfile" x="569" y="128" width="34" height="42"/>
  <path d="M622 162 V138" stroke="#153049" stroke-width="2.4" marker-end="url(#encryption-flow-arrow)"/>
  <path d="M612 128 H632" stroke="#153049" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="596" cy="164" r="9" fill="#a8f5d5" stroke="#153049" stroke-width="2"/>
  <path d="M591.5 164 l3 3 l6 -6" fill="none" stroke="#153049" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="593" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1f2e">Verify</text>
  <text x="593" y="226" text-anchor="middle" font-size="13" fill="#31506a">upload it back to prove</text>
  <text x="593" y="242" text-anchor="middle" font-size="13" fill="#31506a">you saved it</text>
  <!-- 4 encrypt -->
  <path d="M791 134 a3 3 0 0 1 3 -3 h12 l5 5 h22 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-39 a3 3 0 0 1 -3 -3 z" fill="#b8ebfa" stroke="#153049" stroke-width="2" stroke-linejoin="round"/>
  <use href="#encryption-flow-lock" x="824" y="146" width="24" height="26"/>
  <text x="819" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#0b1f2e">Encrypt files</text>
  <text x="819" y="226" text-anchor="middle" font-size="13" fill="#31506a">CCM locks every file</text>
  <text x="819" y="242" text-anchor="middle" font-size="13" fill="#31506a">in the folder</text>

  <!-- lane B -->
  <rect x="20" y="292" width="920" height="232" rx="14" fill="#f6fafc" stroke="#275070" stroke-width="1.5"/>
  <text x="44" y="322" font-size="17" font-weight="700" fill="#0b1f2e">Open an encrypted folder</text>

  <!-- inputs -->
  <rect x="45" y="338" width="220" height="56" rx="10" fill="#ffffff" stroke="#275070" stroke-width="1.5"/>
  <use href="#encryption-flow-keyfile" x="59" y="345" width="34" height="42"/>
  <text x="106" y="362" font-size="15" font-weight="700" fill="#0b1f2e">Key file</text>
  <text x="106" y="382" font-family="'Martian Mono', monospace" font-size="12" fill="#153049">.ccmkey</text>

  <rect x="45" y="410" width="220" height="56" rx="10" fill="#ffffff" stroke="#275070" stroke-width="1.5"/>
  <rect x="57" y="426" width="40" height="24" rx="4" fill="#edf2ff" stroke="#153049" stroke-width="2"/>
  <g fill="#153049"><circle cx="67" cy="438" r="2.6"/><circle cx="77" cy="438" r="2.6"/><circle cx="87" cy="438" r="2.6"/></g>
  <text x="106" y="434" font-size="15" font-weight="700" fill="#0b1f2e">Account password</text>
  <text x="106" y="453" font-size="13" fill="#31506a">the one you sign in with</text>

  <!-- merge -->
  <g fill="none" stroke="#275070" stroke-width="2">
    <path d="M267 366 H284 Q296 366 296 378 V390"/>
    <path d="M267 438 H284 Q296 438 296 426 V414"/>
    <path d="M309 402 H336" marker-end="url(#encryption-flow-arrow)"/>
  </g>
  <circle cx="296" cy="402" r="12" fill="#ffffff" stroke="#275070" stroke-width="2"/>
  <path d="M290 402 h12 M296 396 v12" stroke="#153049" stroke-width="2.4" stroke-linecap="round"/>

  <!-- unlock -->
  <rect x="340" y="350" width="190" height="104" rx="10" fill="#f0e8ff" stroke="#275070" stroke-width="2"/>
  <path d="M360 392 V382 a8 8 0 0 1 16 0" fill="none" stroke="#153049" stroke-width="2.4"/>
  <rect x="353" y="392" width="26" height="20" rx="3" fill="#ffffff" stroke="#153049" stroke-width="2"/>
  <circle cx="366" cy="402" r="2.2" fill="#153049"/>
  <text x="392" y="398" font-size="17" font-weight="700" fill="#0b1f2e">Unlock</text>
  <text x="392" y="418" font-size="13" fill="#31506a">opens the key</text>

  <path d="M532 402 H584" fill="none" stroke="#275070" stroke-width="2" marker-end="url(#encryption-flow-arrow)"/>

  <!-- files readable -->
  <rect x="588" y="350" width="332" height="104" rx="10" fill="#ddfbef" stroke="#275070" stroke-width="2"/>
  <g stroke="#153049" stroke-width="2" stroke-linejoin="round">
    <path d="M606 372 h18 l8 8 v32 h-26 z" fill="#ffffff"/>
    <path d="M620 380 h18 l8 8 v32 h-26 z" fill="#ffffff"/>
    <path d="M626 396 h14 M626 403 h14 M626 410 h10" stroke-width="1.5"/>
  </g>
  <text x="664" y="394" font-size="17" font-weight="700" fill="#0b1f2e">Files readable in CCM</text>
  <text x="664" y="414" font-size="13" fill="#31506a">open, edit and save as usual</text>

  <!-- memory note -->
  <rect x="340" y="468" width="580" height="42" rx="10" fill="#ffffff" stroke="#275070" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g stroke="#153049" stroke-width="1.8">
    <rect x="356" y="479" width="20" height="20" rx="3" fill="#e0f6fd"/>
    <path d="M361 475 v4 M366 475 v4 M371 475 v4 M361 499 v4 M366 499 v4 M371 499 v4 M352 484 h4 M352 489 h4 M352 494 h4 M376 484 h4 M376 489 h4 M376 494 h4" fill="none"/>
  </g>
  <text x="390" y="494" font-size="14" fill="#0b1f2e"><tspan font-weight="700">Key kept in memory only.</tspan> Forgotten on:</text>
  <!-- lock -->
  <use href="#encryption-flow-lock" x="664" y="479" width="16" height="18"/>
  <text x="686" y="494" font-size="14" fill="#0b1f2e">lock</text>
  <!-- sign-out -->
  <g fill="none" stroke="#153049" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M736 480 h-9 v18 h9"/>
    <path d="M733 489 h12 M741 485 l4 4 l-4 4"/>
  </g>
  <text x="752" y="494" font-size="14" fill="#0b1f2e">sign-out</text>
  <!-- timeout -->
  <circle cx="829" cy="489" r="9" fill="#ffffff" stroke="#153049" stroke-width="1.8"/>
  <path d="M829 483 v6 l4 3" fill="none" stroke="#153049" stroke-width="1.8" stroke-linecap="round"/>
  <text x="844" y="494" font-size="14" fill="#0b1f2e">timeout</text>
</svg>
